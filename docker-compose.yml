  postgres:
    image: postgres:16
    container_name: mtga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arena_helper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arena_helper"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: