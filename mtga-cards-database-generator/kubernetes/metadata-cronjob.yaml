apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arena-helper-metadata-output
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arena-helper-metadata
spec:
  schedule: "0 13 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: metadata-generator
              image: arena-helper-metadata:latest
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: output
                  mountPath: /app/output
          volumes:
            - name: output
              persistentVolumeClaim:
                claimName: arena-helper-metadata-output
