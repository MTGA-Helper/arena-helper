<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Arena Helper Account</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #647066;
      --paper: #f4f1e8;
      --panel: #fffdf7;
      --line: #d9ded3;
      --green: #1f674d;
      --green-dark: #174938;
      --gold: #d59a38;
      --error: #a2392f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      color: var(--ink);
      background: radial-gradient(circle at 15% 10%, #e6eee0 0, transparent 36%), var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(100%, 560px); }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font: 700 12px/1.2 system-ui, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 7vw, 52px); line-height: .98; }
    .intro { margin: 0 0 24px; color: var(--muted); font: 16px/1.5 system-ui, sans-serif; }
    form {
      padding: clamp(22px, 5vw, 36px);
      border: 1px solid var(--line);
      border-top: 5px solid var(--gold);
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(23, 33, 27, .09);
    }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; font: 700 14px/1.2 system-ui, sans-serif; }
    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #bfc9bc;
      border-radius: 3px;
      color: var(--ink);
      background: #fff;
      font: 16px system-ui, sans-serif;
    }
    input:focus { outline: 3px solid rgba(213, 154, 56, .28); border-color: var(--green); }
    .hint { margin: 7px 0 0; color: var(--muted); font: 12px/1.45 system-ui, sans-serif; }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 8px;
      border: 0;
      border-radius: 3px;
      color: white;
      background: var(--green);
      cursor: pointer;
      font: 700 15px system-ui, sans-serif;
    }
    button:hover { background: var(--green-dark); }
    button:disabled { cursor: wait; opacity: .65; }
    #message { min-height: 24px; margin: 18px 0 0; font: 14px/1.45 system-ui, sans-serif; }
    #message.error { color: var(--error); }
    #message.success { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Arena Helper</p>
    <h1>Create your account</h1>
    <p class="intro">Connect your Arena identity to start building your personal helper profile.</p>

    <form id="registration-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
        <p class="hint">At least 12 characters with lowercase, uppercase, a number, and a special character.</p>
      </div>

      <div class="field">
        <label for="password_verification">Verify password</label>
        <input id="password_verification" name="password_verification" type="password" autocomplete="new-password" required>
      </div>

      <div class="field">
        <label for="mtg_player_id">MTG Arena Player ID</label>
        <input id="mtg_player_id" name="mtg_player_id" type="text" autocomplete="off" required>
      </div>

      <div class="field">
        <label for="display_player_id">Display Player ID</label>
        <input id="display_player_id" name="display_player_id" type="text" autocomplete="nickname" required>
      </div>

      <button type="submit">Create account</button>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="hint"><a href="/login.html">Already have an account? Log in.</a></p>
    </form>
  </main>

  <script>
    const form = document.querySelector("#registration-form");
    const message = document.querySelector("#message");
    const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{12,}$/;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const values = Object.fromEntries(new FormData(form));
      message.className = "";

      if (!passwordPattern.test(values.password)) {
        message.textContent = "Use a 12+ character password with lowercase, uppercase, a number, and a special character.";
        message.className = "error";
        return;
      }
      if (values.password !== values.password_verification) {
        message.textContent = "Passwords do not match.";
        message.className = "error";
        return;
      }

      const button = form.querySelector("button");
      button.disabled = true;
      message.textContent = "Creating account...";

      try {
        const response = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(values)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "Unable to create account.");
        message.textContent = result.message;
        message.className = "success";
        form.reset();
      } catch (error) {
        message.textContent = error.message;
        message.className = "error";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
