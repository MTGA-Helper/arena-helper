<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Arena Helper</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #647066;
      --paper: #f4f1e8;
      --panel: #fffdf7;
      --line: #d9ded3;
      --green: #1f674d;
      --green-dark: #174938;
      --gold: #d59a38;
      --error: #a2392f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      background: radial-gradient(circle at 85% 10%, #e6eee0 0, transparent 38%), var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(100%, 430px); }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--green);
      font: 700 12px/1.2 system-ui, sans-serif;
      letter-spacing: .14em;
      text-align: center;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 8px; font-size: clamp(34px, 8vw, 50px); line-height: 1; text-align: center; }
    .intro { margin: 0 0 24px; color: var(--muted); font: 15px/1.5 system-ui, sans-serif; text-align: center; }
    form {
      padding: clamp(22px, 6vw, 36px);
      border: 1px solid var(--line);
      border-top: 5px solid var(--gold);
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(23, 33, 27, .09);
    }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; font: 700 14px/1.2 system-ui, sans-serif; }
    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #bfc9bc;
      border-radius: 3px;
      color: var(--ink);
      background: #fff;
      font: 16px system-ui, sans-serif;
    }
    input:focus { outline: 3px solid rgba(213, 154, 56, .28); border-color: var(--green); }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 6px;
      border: 0;
      border-radius: 3px;
      color: white;
      background: var(--green);
      cursor: pointer;
      font: 700 15px system-ui, sans-serif;
    }
    button:hover { background: var(--green-dark); }
    button:disabled { cursor: wait; opacity: .65; }
    .link { margin: 18px 0 0; text-align: center; }
    a { color: var(--green); font: 14px system-ui, sans-serif; }
    #message { min-height: 24px; margin: 18px 0 0; font: 14px/1.45 system-ui, sans-serif; }
    #message.error { color: var(--error); }
    #message.success { color: var(--green); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Arena Helper</p>
    <h1>Welcome back</h1>
    <p class="intro">Log in to continue to your Arena Helper profile.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button type="submit">Log in</button>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="link"><a href="/register.html">Need an account? Register here.</a></p>
    </form>
  </main>

  <script>
    const form = document.querySelector("#login-form");
    const message = document.querySelector("#message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const values = Object.fromEntries(new FormData(form));
      const button = form.querySelector("button");
      message.className = "";
      button.disabled = true;
      message.textContent = "Signing in...";

      try {
        const response = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(values)
        });
        const responseText = await response.text();
        let result;
        try {
          result = responseText ? JSON.parse(responseText) : {};
        } catch {
          result = { detail: responseText || "Unable to log in." };
        }
        if (!response.ok) throw new Error(result.detail || "Unable to log in.");
        sessionStorage.setItem("arena_helper_access_token", result.access_token);
        window.location.href = "/user.html";
      } catch (error) {
        message.textContent = error.message;
        message.className = "error";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
