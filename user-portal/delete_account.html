<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete account | Arena Helper</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #647066;
      --paper: #f4f1e8;
      --panel: #fffdf7;
      --line: #d9ded3;
      --green: #1f674d;
      --error: #a2392f;
      --error-dark: #7d2923;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: var(--ink); background: radial-gradient(circle at 85% 10%, #f3d8cb 0, transparent 38%), var(--paper); font-family: Georgia, "Times New Roman", serif; }
    main { width: min(100%, 520px); }
    .eyebrow { margin: 0 0 10px; color: var(--error); font: 700 12px system-ui, sans-serif; letter-spacing: .14em; text-align: center; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 8vw, 52px); line-height: 1; text-align: center; }
    .intro { margin: 0 0 24px; color: var(--muted); font: 15px/1.5 system-ui, sans-serif; text-align: center; }
    section { padding: clamp(22px, 6vw, 38px); border: 1px solid #e3c5bd; border-top: 5px solid var(--error); background: var(--panel); box-shadow: 0 18px 50px rgba(23, 33, 27, .09); }
    .warning { margin: 0 0 24px; padding: 14px; color: var(--error-dark); background: #f9e9e5; font: 14px/1.5 system-ui, sans-serif; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; font: 700 14px/1.2 system-ui, sans-serif; }
    input[type="password"] { width: 100%; min-height: 46px; padding: 11px 13px; border: 1px solid #cbb7b1; border-radius: 3px; font: 16px system-ui, sans-serif; }
    input:focus { outline: 3px solid rgba(162, 57, 47, .2); border-color: var(--error); }
    .acknowledge { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; font: 14px/1.45 system-ui, sans-serif; }
    .acknowledge input { width: 18px; height: 18px; flex: 0 0 auto; margin: 1px 0 0; accent-color: var(--error); }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 3px; color: white; background: var(--error); cursor: pointer; font: 700 14px system-ui, sans-serif; }
    button:hover { background: var(--error-dark); }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .cancel { display: block; margin-top: 18px; color: var(--green); text-align: center; font: 14px system-ui, sans-serif; }
    #message { min-height: 22px; margin: 16px 0 0; color: var(--error); font: 14px/1.45 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Permanent action</p>
    <h1>Delete your account</h1>
    <p class="intro">This action cannot be undone.</p>

    <section>
      <p class="warning">Your account and its associated profile, collection, wildcard inventory, and match history will be permanently deleted.</p>
      <form id="delete-form" novalidate>
        <label class="acknowledge" for="confirm-delete">
          <input id="confirm-delete" type="checkbox" required>
          <span>I understand that deleting my account is permanent.</span>
        </label>
        <div class="field">
          <label for="password">Enter your password to continue</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="delete-button" type="submit" disabled>Delete account permanently</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
      <a class="cancel" href="/user.html">Cancel and return to profile</a>
    </section>
  </main>

  <script>
    const tokenKey = "arena_helper_access_token";
    const token = sessionStorage.getItem(tokenKey);
    const form = document.querySelector("#delete-form");
    const confirmation = document.querySelector("#confirm-delete");
    const button = document.querySelector("#delete-button");
    const message = document.querySelector("#message");

    if (!token) window.location.replace("/");

    confirmation.addEventListener("change", () => {
      button.disabled = !confirmation.checked;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!confirmation.checked) return;
      button.disabled = true;
      message.textContent = "Deleting account...";
      try {
        const response = await fetch("/auth/account", {
          method: "DELETE",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify({ password: document.querySelector("#password").value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "Unable to delete account.");
        sessionStorage.removeItem(tokenKey);
        window.location.replace("/");
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
