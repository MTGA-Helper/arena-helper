input {
  file {
    #https://www.elastic.co/guide/en/logstash/current/plugins-inputs-file.html
    #default is TAIL which assumes more data will come into the file.
    #change to mode => "read" if the file is a compelte file.  by default, the file will be removed once reading is complete -- backup your files if you need them.
    mode => "tail"
    start_position => "beginning"
    codec => multiline {
      pattern => "^\{"
      negate => true
      what => "previous"
      auto_flush_interval => 2
    }
    path => "/usr/share/logstash/ingest_data/*"
  }
}


filter {
  # Keep only events that begin with a JSON match object; drop script chatter.
  if [message] !~ /^\{/ {
    drop { }
  }
  # The last event may carry trailing summary text; trim to the closing brace.
  ruby {
    code => 'm = event.get("message"); event.set("message", m[0..m.rindex("}")])'
  }
  json {
    source => "message"
    remove_field => ["message", "event", "log", "host", "@version", "tags"]
  }
  mutate {
    add_field => { "user_id" => "%{myGamerTag}" }
  }
}


output {
  elasticsearch {
    index => "standard_84"
    hosts=> "${ELASTIC_HOSTS}"
    user=> "${ELASTIC_USER}"
    password=> "${ELASTIC_PASSWORD}"
    cacert=> "certs/ca/ca.crt"
  }
}